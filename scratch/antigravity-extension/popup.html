<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 250px; font-family: sans-serif; background: #1a1a20; color: white; padding: 20px; }
    h1 { font-size: 16px; margin: 0 0 10px 0; color: #06B6D4; }
    .status-card { border: 1px solid #333; border-radius: 8px; padding: 15px; background: #222; }
    .status-text { font-size: 14px; margin-bottom: 5px; }
    .hint { font-size: 11px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Antigravity status</h1>
  <div class="status-card">
    <div class="status-text">Ollama Monitoring Connected</div>
    <div class="hint">Check the bottom-right corner of your browser for the real-time indicator.</div>
  </div>
</body>
</html>
